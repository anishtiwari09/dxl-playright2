name: Playwright Tests

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright browsers
        run: yarn playwright install --with-deps

      - name: Print system specs
        run: |
          echo "========================================"
          echo "System Information"
          echo "========================================"
          echo "Time: $(date '+%Y-%m-%d %H:%M:%S %Z %z')"
          echo "CPU Cores: $(nproc)"
          echo "CPU: $(lscpu | grep 'Model name' | sed 's/^[^:]*: *//')"
          echo "RAM: $(free -h | awk '/Mem:/ {print $2}')"
          echo "OS: $(lsb_release -ds 2>/dev/null || cat /etc/os-release | grep PRETTY_NAME)"
          echo "Runner: $RUNNER_NAME"
          echo "Node: $(node --version)"
          echo "Yarn: $(yarn --version)"
          echo "Playwright: $(yarn playwright --version)"
          echo "========================================"

      - name: Get timestamp
        run: echo "TIMESTAMP=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV

      - name: Run Playwright tests
        run: yarn playwright test

      - name: Upload Playwright report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ env.TIMESTAMP }}
          path: |
            playwright-report/
            test-results/
          retention-days: 1

      - name: Setup GitHub Pages
        if: ${{ !cancelled() }}
        uses: actions/configure-pages@v5

      - name: Upload Playwright report to GitHub Pages
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: playwright-report/

      - name: Deploy Playwright report to GitHub Pages
        if: ${{ !cancelled() }}
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print Playwright report URL
        if: ${{ !cancelled() }}
        run: |
          echo "========================================"
          echo "Playwright Report"
          echo "========================================"
          echo "Report URL: ${{ steps.deployment.outputs.page_url }}"
          echo "========================================"